<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090b14" />
    <meta name="description" content="IT Quiz - ôn tập kiến thức IT, chuẩn bị phỏng vấn, chạy offline." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>IT Quiz</title>
    <script>
      (function () {
        try {
          var s = (JSON.parse(localStorage.getItem('itquiz.v1')) || {}).settings || {};
          var r = document.documentElement;
          var dark = s.theme === 'dark' || (s.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          r.dataset.mode = dark ? 'dark' : 'light';
          r.dataset.style = s.style || 'obsidian';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
